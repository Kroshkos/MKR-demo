:root{--bg:#f7f3eb;--surface:#fffdf8;--surface2:#eee8dc;--text:#17233d;--muted:#60687a;--border:#dcd7cc;--nav:#102541;--gold:#c6a15b;--accent:#163f66;--coral:#f6453f;--good:#2f7058;--bad:#aa3833;--text-xs:12px;--text-sm:14px;--text-base:16px;--text-lg:20px;--text-xl:clamp(24px,2vw,30px);color-scheme:light}
[data-theme=dark]{--bg:#101b2e;--surface:#19283e;--surface2:#24354c;--text:#f5f1e8;--muted:#b5bfd0;--border:#39465a;--accent:#abc8e7;--good:#88ceb1;--bad:#ff9a90;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--text-sm)/1.55 Vmeda,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible{outline:3px solid var(--gold)}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent)}button,input,select,textarea{min-height:42px}input,textarea,select{color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;max-width:100%}textarea{min-height:90px;resize:vertical;width:100%}h1,h2,h3,p{margin:0}h1{font-size:var(--text-xl);letter-spacing:-.6px;line-height:1.2}h2{font-size:var(--text-lg);line-height:1.4}h3{font-size:var(--text-base)}small,.small{font-size:var(--text-xs)}.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums}.skip{position:fixed;top:-80px;left:10px;background:var(--surface);z-index:100}.skip:focus{top:8px}

function load(modeName){try{const raw=localStorage.getItem('generation-vmeda-'+modeName);if(raw){const x=JSON.parse(raw);validateDb(x);return x}}catch(e){console.warn('Локальное хранилище недоступно или повреждено',e.message)}return modeName==='demo'?makeDemo():baseDb(false)}
function persist(){db.revision++;db.saved_at=now();try{localStorage.setItem('generation-vmeda-'+mode,JSON.stringify(db));$('save-state').textContent='Сохранено локально · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){$('save-state').textContent='Только в памяти: сохраните JSON';toast('Браузер не разрешил локальное сохранение. Сохраните JSON перед закрытием.')} }
function audit(action,entity,id,before,after){add('audit_log',{actor:role,action,entity,entity_id:id,before:before?JSON.parse(JSON.stringify(before)):null,after:after?JSON.parse(JSON.stringify(after)):null})}
function validateDb(x){if(x.format!=='vmeda-1'||x.schema_version!==1)throw Error('Неподдерживаемый формат базы');for(const t of SCHEMA){if(!Array.isArray(x[t.key]))throw Error('Нет таблицы '+t.title);const ids=new Set();for(const r of x[t.key]){if(!r.id||ids.has(r.id))throw Error('Повтор или отсутствие ID: '+t.title);ids.add(r.id)}}
 for(const t of SCHEMA)for(const r of x[t.key]){
  if(typeof r.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(r.id))throw Error('Некорректный ID: '+t.key);
  for(const f of t.fields){const v=r[f.key];if(f.ref&&v&&!x[f.ref].some(z=>z.id===v))throw Error('Нарушена связь '+t.key+'.'+f.key);if(v!==null&&v!==undefined&&v!==''){if(f.type==='number'&&(typeof v!=='number'||!Number.isFinite(v)))throw Error('Некорректное число: '+t.key+'.'+f.key);if(['text','textarea','date','timestamp','url','select','ref'].includes(f.type)&&typeof v!=='string')throw Error('Некорректный тип: '+t.key+'.'+f.key);if(f.type==='bool'&&typeof v!=='boolean')throw Error('Некорректный флаг: '+t.key+'.'+f.key)}}
 }
 for(const [k,keys] of [['external_ids',['source_id','external_id']],['academic_records',['source_id','external_record_id']],['assessment_scores',['assessment_id','competency_id']],['achievement_documents',['achievement_id','document_id']]]){const seen=new Set();for(const r of x[k]){const key=keys.map(k=>r[k]).join('|');if(seen.has(key))throw Error('Нарушена уникальность: '+k);seen.add(key)}}
}

function scopePeople(){let ps=rows('people');if(role==='Обучающийся')return ps.filter(p=>p.id===(scopeId||ps[0]?.id));if(role==='Факультет')return ps.filter(p=>p.faculty_id===(scopeId||rows('units').find(x=>x.kind==='Факультет')?.id));if(role==='Наставник'){const ids=rows('mentor_assignments').filter(x=>x.staff_id===(scopeId||rows('staff')[0]?.id)&&!x.end).map(x=>x.person_id);return ps.filter(p=>ids.includes(p.id))}return ps}

function settingsView(){const t=byKey[settingsTable],editable=['edit','version'].includes(t.mode);const shown=rows(t.key).filter(r=>!filterText||JSON.stringify(r).toLowerCase().includes(filterText.toLowerCase()));const fs=t.fields.filter(f=>!['created_at','updated_at'].includes(f.key));return heading('Справочники и структура базы','Единая модель HTML и Excel: 38 таблиц. Системные журналы изменяются только через соответствующие процессы.',editable?btn('Добавить запись',`editRecord('${t.key}')`,'primary'):'')+`<div class="banner">Рабочие факультеты, программы и подразделения необходимо заменить на фактические. Компетенции и названия справочников являются стартовым проектом. Редактирование использованной позиции баллов создаёт новую редакцию; старые начисления сохраняются.</div><div class="filters"><select aria-label="Таблица базы" onchange="settingsTable=this.value;filterText='';render()">${SCHEMA.map(s=>`<option value="${s.key}" ${s.key===t.key?'selected':''}>${esc(s.title)} (${s.key})</option>`).join('')}</select><input aria-label="Поиск в таблице" placeholder="Поиск в записях…" value="${esc(filterText)}" onchange="filterText=this.value;render()">${btn('Экспорт таблицы',`exportTable('${t.key}')`)}</div>`+card(esc(t.title),`<div class="card-body"><p>${esc(t.description)}</p><div class="small muted">${esc(t.key)} · ${rows(t.key).length} записей · ответственный: ${esc(t.owner)} · ${editable?'управление справочником':'только просмотр; специальный процесс'}</div></div>${tableHtml([...fs.map(f=>esc(f.label)),...(editable?['']:[])],shown,r=>`<tr>${fs.map(f=>{let v=r[f.key];if(f.ref)v=label(f.ref,v);else if(typeof v==='object')v=JSON.stringify(v);else if(f.type==='bool')v=v?'Да':'Нет';return `<td class="wrap" style="min-width:125px;max-width:290px" title="${esc(v)}">${esc(String(v??'').slice(0,180))}${String(v??'').length>180?'…':''}</td>`}).join('')}${editable?`<td>${btn('Изменить',`editRecord('${t.key}','${r.id}')`,'small')}</td>`:''}</tr>`)}`)+card('Как хранить и развивать базу',`<div class="card-body"><p>Сейчас таблицы хранятся как связанные массивы в браузере. JSON-копия содержит все таблицы и журнал изменений. Для серверного внедрения используйте Excel-словарь как основу реляционной БД: внешние ключи, транзакции, уникальные ограничения и серверная авторизация.</p><p class="notice">Смена рабочего места только демонстрирует интерфейс. Любой владелец HTML и JSON может прочитать полную базу. Не размещайте реальные персональные сведения в публичном хранилище или в общей ссылке предпросмотра.</p></div>`)}
function exportTable(k){const fs=byKey[k].fields;csvDownload(k+'.csv',[fs.map(f=>f.key),...rows(k).map(r=>fs.map(f=>typeof r[f.key]==='object'?JSON.stringify(r[f.key]):r[f.key]))])}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csvDownload(name,data){download(name,'\ufeff'+data.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('Pokolenie-VMedA-'+mode+'-'+today()+'.json',JSON.stringify({...db,mode},null,2));toast('JSON-копия подготовлена. Храните её в защищённой папке.')}
function restoreFile(input){const file=input.files[0];if(!file)return;file.text().then(text=>{const x=JSON.parse(text);validateDb(x);if(x.mode&&x.mode!==mode)throw Error('Копия относится к другому режиму. Сначала переключите режим базы.');openModal('Восстановление базы',`<p>Будет заменена текущая ${mode==='work'?'рабочая':'демонстрационная'} база: ${x.people.length} карточек, ${x.achievements.length} достижений. Сначала сохраните текущую JSON-копию.</p>`,()=>{db=x;db.revision=n(db.revision);audit('Восстановление JSON','database','',null,{filename:file.name});persist();closeModal();navigate('overview')},'Заменить текущую базу')}).catch(e=>toast('Не удалось восстановить: '+e.message));input.value=''}
const IMPORT_KEYS=['external_id','external_record_id','period_id','kind','subject','value','date'];
function importView(){return heading('Импорт и резервные копии','Настраиваемый обмен CSV / JSON. Подключения к существующей учебной системе пока нет.')+`<div class="grid">${card('Учебные сведения',`<div class="card-body"><ol class="guide"><li>В справочниках настройте источник и периоды.</li><li>Свяжите внешний ID с карточкой в таблице external_ids.</li><li>Подготовьте строки по шаблону или сопоставьте названия столбцов.</li><li>Проверьте ошибки, затем примите пакет.</li></ol><p class="notice">ФИО не используется для автоматического объединения. Неизвестный внешний ID блокирует строку. Существующие записи обновляются по паре «источник + ID записи».</p><div class="actions">${btn('Шаблон CSV','importTemplate()')}<label class="btn primary">Выбрать CSV / JSON<input type="file" accept=".csv,.json" hidden onchange="readImport(this)"></label></div></div>`)}${card('Локальные копии',`<div class="card-body"><p>Сохраняйте JSON после каждого сеанса и перед важными решениями. Перенос или переименование HTML, очистка браузера и ограничения хранения могут сделать локальные данные недоступными.</p><div class="actions" style="margin-top:18px">${btn('Сохранить JSON','backup()','primary')}<label class="btn">Восстановить JSON<input type="file" accept=".json" hidden onchange="restoreFile(this)"></label></div><p class="notice">Режимы изолированы. Восстановление не объединяет, а заменяет выбранную базу после подтверждения. Копия не зашифрована.</p></div>`)}</div><div id="import-stage"></div>`+card('История принятых пакетов',tableHtml(['Файл','Состояние','Строк принято','Ошибок','Дата'],rows('import_batches'),b=>`<tr><td>${esc(b.filename)}</td><td>${tag(b.status)}</td><td>${b.accepted}</td><td>${b.errors}</td><td>${fmt(b.created_at)}</td></tr>`))}
function importTemplate(){csvDownload('academic-template.csv',[IMPORT_KEYS,['EXTERNAL-PERSON-001','RECORD-001',currentPeriod,'Средний балл','Средний балл за семестр','4.8',today()]])}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/)[0],sep=first.includes(';')?';':',';const rr=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rr.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Незакрытые кавычки в CSV');row.push(cell);if(row.some(x=>x.trim()))rr.push(row);const head=rr.shift()?.map(x=>x.trim());if(!head?.length||new Set(head).size!==head.length)throw Error('Нет заголовков или они повторяются');return rr.map((r,i)=>{if(r.length!==head.length)throw Error('Неверное число столбцов в строке '+(i+2));return Object.fromEntries(head.map((h,j)=>[h,r[j]]))})}
function readImport(input){const file=input.files[0];if(!file)return;file.text().then(txt=>{let data=file.name.toLowerCase().endsWith('.json')?JSON.parse(txt):parseCSV(txt);if(!Array.isArray(data)||!data.length||data.some(r=>!r||typeof r!=='object'||Array.isArray(r)))throw Error('Нужен непустой массив объектов или CSV с заголовками');if(data.length>20000)throw Error('Один пакет: не более 20 000 строк');pendingImport={filename:file.name,data};const cols=Object.keys(data[0]);$('import-stage').innerHTML=card('Сопоставление полей',`<div class="card-body"><form id="mapping-form"><div class="form-grid">${fieldHtml({key:'source_id',label:'Источник',type:'ref',ref:'external_sources',required:true},rows('external_sources')[0]?.id)}${IMPORT_KEYS.map(k=>`<div class="field"><label for="map-${k}">${k}</label><select id="map-${k}" name="${k}" required><option value="">Выберите столбец…</option>${cols.map(c=>`<option ${c===k?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')}</div><button class="btn primary" style="margin-top:18px">Проверить ${data.length} строк</button></form><div id="import-preview"></div></div>`);$('mapping-form').onsubmit=e=>{e.preventDefault();previewImport(new FormData(e.target))}}).catch(e=>toast('Ошибка файла: '+e.message));input.value=''}
function previewImport(fd){const source=fd.get('source_id'),mapping=Object.fromEntries(IMPORT_KEYS.map(k=>[k,fd.get(k)])),seen=new Set();if(new Set(Object.values(mapping)).size!==IMPORT_KEYS.length)return toast('Каждому полю нужен отдельный столбец');const result=pendingImport.data.map((raw,i)=>{const r=Object.fromEntries(IMPORT_KEYS.map(k=>[k,String(raw[mapping[k]]??'').trim()])),errors=[];const match=rows('external_ids').filter(x=>x.source_id===source&&x.external_id===r.external_id);if(match.length!==1)errors.push('Внешний ID не сопоставлен однозначно');if(IMPORT_KEYS.some(k=>!r[k]))errors.push('Есть пустые обязательные поля');if(!find('periods',r.period_id))errors.push('Неизвестный семестр');if(!byKey.academic_records.fields.find(f=>f.key==='kind').options.includes(r.kind))errors.push('Неизвестный тип сведений');if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||Number.isNaN(Date.parse(r.date))||r.date>today())errors.push('Некорректная дата');if(['Оценка','Средний балл'].includes(r.kind)){r.value=r.value.replace(',','.');if(!Number.isFinite(Number(r.value))||Number(r.value)<0||Number(r.value)>5)errors.push('Оценка вне диапазона 0–5')}if(seen.has(r.external_record_id))errors.push('Повтор ID записи в пакете');seen.add(r.external_record_id);const old=rows('academic_records').find(a=>a.source_id===source&&a.external_record_id===r.external_record_id);if(old&&old.person_id!==match[0]?.person_id)errors.push('ID записи уже относится к другому человеку');return {row:i+2,r,person_id:match[0]?.person_id,old,errors}});pendingImport={...pendingImport,source,mapping,result};const bad=result.filter(x=>x.errors.length);$('import-preview').innerHTML=`<div class="notice">Готово: ${result.length-bad.length}; ошибок: ${bad.length}. При наличии ошибок пакет целиком не принимается. Первые 100 строк показаны ниже.</div>${tableHtml(['Строка','Внешний ID','Показатель','Действие / ошибка'],result.slice(0,100),x=>`<tr><td>${x.row}</td><td>${esc(x.r.external_id)}</td><td>${esc(x.r.subject)}: ${esc(x.r.value)}</td><td>${esc(x.errors.join('; ')||(x.old?'Обновление':'Новая запись'))}</td></tr>`)}${!bad.length?btn('Принять пакет','acceptImport()','primary'):''}`}
function acceptImport(){const p=pendingImport;if(!p?.result||p.result.some(x=>x.errors.length))return;const b=add('import_batches',{source_id:p.source,filename:p.filename,status:'Принят',accepted:p.result.length,errors:0,mapping:p.mapping});p.result.forEach(x=>{const {external_id,...data}=x.r;const rec={...data,source_id:p.source,person_id:x.person_id,batch_id:b.id};if(x.old){const before={...x.old};Object.assign(x.old,rec,{updated_at:now()});audit('Импорт: обновление','academic_records',x.old.id,before,x.old)}else{const a=add('academic_records',rec);audit('Импорт: создание','academic_records',a.id,null,a)}});audit('Принят пакет','import_batches',b.id,null,b);pendingImport=null;persist();render();toast('Пакет принят. Учебные сведения обновлены, баллы автоматически не начислялись.')}
try{mode=localStorage.getItem('generation-vmeda-mode')==='work'?'work':'demo'}catch(e){}
db=load(mode);currentPeriod=mode==='work'?'per3':'per2';render();persist();
</script>
